name: iOS App Store build

# Manual trigger only. Needs the secrets listed in docs/len-app-store.md.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (must increase every upload)"
        required: true
        default: "1"

jobs:
  build-upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build web
        run: |
          npm install
          npm run build

      - name: Create iOS project
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          plutil -replace NSCameraUsageDescription -string "Chụp Chuẩn dùng camera để hiển thị khung hình và hướng dẫn bố cục." $PLIST
          plutil -replace NSMotionUsageDescription -string "Chụp Chuẩn dùng cảm biến chuyển động để đo độ nghiêng của máy." $PLIST
          plutil -replace NSPhotoLibraryAddUsageDescription -string "Chụp Chuẩn lưu ảnh bạn chụp vào Ảnh." $PLIST
          plutil -replace CFBundleShortVersionString -string "1.0.0" $PLIST
          plutil -replace CFBundleVersion -string "${{ github.event.inputs.build_number }}" $PLIST

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      - name: Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="vn.fidey.chupchuan" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}"

      - name: Export IPA
        run: |
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>vn.fidey.chupchuan</key><string>${{ secrets.IOS_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/build/export"

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -f ios/App/build/export/App.ipa -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - uses: actions/upload-artifact@v4
        with:
          name: App.ipa
          path: ios/App/build/export/App.ipa
