<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chụp Chuẩn">
<meta name="theme-color" content="#0A0C10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Chụp Chuẩn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0A0C10;
    --surface: rgba(14, 17, 24, 0.74);
    --surface-solid: #141821;
    --text: #F2F4F7;
    --muted: #98A0AC;
    --accent: #F5B942;
    --ok: #34D399;
    --warn: #FB7185;
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45;
    overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* ---------- Start ---------- */
  #start {
    height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: calc(env(safe-area-inset-top, 0px) + 36px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px); gap: 22px; overflow-y: auto;
  }
  .brand { display: grid; gap: 8px; justify-items: center; }
  .brand .mark { width: 72px; height: 72px; border-radius: 22px; background: var(--accent); color: #1a1405; display: grid; place-items: center; }
  .brand .mark svg { width: 40px; height: 40px; }
  .brand h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 14px; max-width: 30ch; }
  .pictos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 380px; }
  .picto { display: grid; gap: 8px; justify-items: center; padding: 14px 8px; border-radius: 16px; background: var(--surface-solid); }
  .picto svg { width: 44px; height: 44px; color: var(--accent); }
  .picto span { font-size: 12.5px; color: var(--muted); line-height: 1.25; }
  .cta {
    margin-top: auto; width: 100%; max-width: 380px; height: 68px; border-radius: 22px; border: 0;
    background: var(--accent); color: #1a1405; font-weight: 700; font-size: 18px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  }
  .cta svg { width: 30px; height: 30px; }
  .cta:active { transform: scale(.98); }
  .cta:disabled { opacity: .7; }
  .privacy { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin: 0; }
  .privacy svg { width: 16px; height: 16px; }
  .err { color: var(--warn); font-size: 13.5px; margin: 0; }

  /* ---------- Camera ---------- */
  #app { position: fixed; inset: 0; background: #000; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #cam.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

  .top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 12px; display: grid; gap: 8px;
    background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0));
  }
  .chips { display: flex; gap: 6px; justify-content: center; }
  .chip {
    position: relative; flex: 0 0 auto; width: 46px; height: 40px; border-radius: 14px; border: 1.5px solid transparent;
    background: rgba(20,24,33,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--text);
  }
  .chip svg { width: 24px; height: 24px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1a1405; }
  .chip.detected { border-color: var(--accent); }
  .toolrow { display: flex; align-items: flex-start; gap: 8px; }
  .readout {
    margin-right: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: rgba(10,12,16,.55); padding: 6px 9px; border-radius: 8px; line-height: 1.5; font-variant-numeric: tabular-nums;
    display: grid; gap: 2px;
  }
  .readout .row { display: inline-flex; align-items: center; gap: 6px; }
  .readout svg { width: 14px; height: 14px; }
  .readout b { color: var(--text); font-weight: 500; }
  .readout .good { color: var(--ok); }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 24px; height: 24px; border-radius: 7px; border: 0; background: rgba(255,255,255,.12); color: var(--text); font-weight: 700; line-height: 1; cursor: pointer; padding: 0; }
  .stepper b { min-width: 2.5ch; text-align: center; }
  .icon-btn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; border: 0;
    background: rgba(20,24,33,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: grid; place-items: center; cursor: pointer; color: var(--text);
  }
  .icon-btn[aria-pressed="true"] { background: rgba(245,185,66,.92); color: #1a1405; }
  .icon-btn svg { width: 21px; height: 21px; }

  .rail { position: absolute; right: 10px; top: 44%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  .pose-btn {
    width: 42px; height: 54px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.18);
    background: rgba(20,24,33,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--muted);
  }
  .pose-btn[aria-pressed="true"] { border-color: var(--accent); background: rgba(245,185,66,.18); color: var(--accent); }
  .pose-btn canvas { width: 32px; height: 44px; }
  .pose-btn svg { width: 22px; height: 22px; }

  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; gap: 12px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.74) 40%);
  }
  .hint {
    display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 12px;
    min-height: 96px; padding: 10px 14px 10px 10px; border-radius: 20px;
    background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 2px solid rgba(245,185,66,.55); transition: border-color .25s, background .25s;
  }
  .hint.ok { border-color: rgba(52,211,153,.8); background: rgba(52,211,153,.16); }
  .hint .pic { width: 84px; height: 76px; border-radius: 16px; display: grid; place-items: center; background: rgba(245,185,66,.16); color: var(--accent); }
  .hint.ok .pic { background: rgba(52,211,153,.22); color: var(--ok); }
  .hint .pic svg { width: 66px; height: 66px; }
  .hint-text { display: grid; gap: 2px; min-width: 0; }
  .hint-text .num { font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hint.ok .hint-text .num { color: var(--ok); }
  .hint-text b { font-size: 15.5px; font-weight: 600; line-height: 1.25; }
  .hint-text span { color: var(--muted); font-size: 12px; line-height: 1.3; }

  .checks { display: flex; gap: 8px; justify-content: center; }
  .check { width: 44px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgba(20,24,33,.7); color: #5a6270; }
  .check svg { width: 22px; height: 22px; }
  .check[data-state="pass"] { color: var(--ok); background: rgba(52,211,153,.14); }
  .check[data-state="fail"] { color: var(--accent); background: rgba(245,185,66,.14); }

  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .thumb { justify-self: start; width: 46px; height: 46px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.25); background: #1a1e27 center/cover; padding: 0; cursor: pointer; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .shutter i { display: block; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .1s, background .2s; }
  .shutter.ready i { background: var(--ok); }
  .shutter:active i { transform: scale(.9); }
  .flip { justify-self: end; }

  #countdown { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--mono); font-size: 150px; font-weight: 700; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #flash.on { opacity: .85; transition: none; }

  /* ---------- Preview ---------- */
  #preview { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 12px; }
  #preview img { flex: 1; min-height: 0; width: 100%; object-fit: contain; border-radius: 14px; background: #000; }
  .preview-info { color: var(--muted); font-size: 13px; margin: 0; text-align: center; display: inline-flex; gap: 8px; justify-content: center; align-items: center; }
  .preview-info svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; height: 56px; border-radius: 16px; border: 0; font-weight: 600; font-size: 15.5px; cursor: pointer; background: var(--surface-solid); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .btn svg { width: 24px; height: 24px; }
  .btn.primary { background: var(--accent); color: #1a1405; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); transform: translateX(-50%); background: rgba(20,24,33,.92); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<section id="start">
  <div class="brand">
    <div class="mark" id="brandMark"></div>
    <h1>Chụp Chuẩn</h1>
    <p data-t="tagline"></p>
  </div>
  <div class="pictos">
    <div class="picto"><i data-icon="level"></i><span data-t="p_level"></span></div>
    <div class="picto"><i data-icon="frame"></i><span data-t="p_frame"></span></div>
    <div class="picto"><i data-icon="auto"></i><span data-t="p_auto"></span></div>
  </div>
  <p class="err" id="startErr" hidden></p>
  <button class="cta" id="startBtn"><i data-icon="camera"></i><span data-t="open"></span></button>
  <p class="privacy"><i data-icon="lock"></i><span data-t="privacy"></span></p>
</section>

<section id="app" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="flash"></div>

  <div class="top">
    <div class="chips" id="modeChips">
      <button class="chip auto" data-mode="auto" aria-pressed="true"><i data-icon="auto"></i></button>
      <button class="chip" data-mode="person" aria-pressed="false"><i data-icon="person"></i></button>
      <button class="chip" data-mode="group" aria-pressed="false"><i data-icon="group"></i></button>
      <button class="chip" data-mode="selfie" aria-pressed="false"><i data-icon="selfie"></i></button>
      <button class="chip" data-mode="scene" aria-pressed="false"><i data-icon="scene"></i></button>
      <button class="chip" data-mode="food" aria-pressed="false"><i data-icon="food"></i></button>
    </div>
    <div class="toolrow">
      <div class="readout" id="readout">
        <span class="row"><i data-icon="level"></i><b id="rRoll">--</b>°<i data-icon="tilt"></i><b id="rPitch">--</b>°</span>
        <span class="row" id="groupRow" hidden><i data-icon="group"></i><span class="stepper"><button id="cntMinus">−</button><b id="cntVal">?</b><button id="cntPlus">+</button></span></span>
      </div>
      <button class="icon-btn" id="gridBtn" aria-pressed="true"><i data-icon="grid"></i></button>
      <button class="icon-btn" id="autoBtn" aria-pressed="true"><i data-icon="timer"></i></button>
      <button class="icon-btn" id="bodyBtn" aria-pressed="false"><i data-icon="body"></i></button>
    </div>
  </div>

  <div class="rail" id="poseRail"></div>

  <div class="bottom">
    <div class="hint" id="hint">
      <div class="pic" id="hintPic"></div>
      <div class="hint-text"><span class="num" id="hintNum" hidden></span><b id="hintMain">…</b><span id="hintSub"></span></div>
    </div>
    <div class="checks">
      <span class="check" data-state="none" id="ckLevel"><i data-icon="level"></i></span>
      <span class="check" data-state="none" id="ckPitch"><i data-icon="tilt"></i></span>
      <span class="check" data-state="none" id="ckSubject"><i data-icon="frame"></i></span>
      <span class="check" data-state="none" id="ckLight"><i data-icon="sun"></i></span>
    </div>
    <div class="controls">
      <button class="thumb" id="thumb"></button>
      <button class="shutter" id="shutter"><i></i></button>
      <button class="icon-btn flip" id="flipBtn"><i data-icon="flip"></i></button>
    </div>
  </div>
  <div id="countdown"></div>
</section>

<section id="preview" hidden>
  <img id="previewImg" alt="">
  <p class="preview-info" id="previewInfo" hidden><i data-icon="burst"></i><span id="previewInfoText"></span></p>
  <div class="row">
    <button class="btn" id="retake"><i data-icon="back"></i><span data-t="retake"></span></button>
    <button class="btn primary" id="save"><i data-icon="save"></i><span data-t="save"></span></button>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const DEG = 180 / Math.PI;

  // ================= Language (text is secondary; pictograms carry the meaning) =================
  const LANG = (navigator.language || 'en').toLowerCase().startsWith('vi') ? 'vi' : 'en';
  const T = {
    tagline: { vi: 'Giơ máy lên, làm theo hình. Xanh là chụp.', en: 'Point, follow the picture. Green means shoot.' },
    p_level: { vi: 'Cân máy', en: 'Level' }, p_frame: { vi: 'Bố cục', en: 'Framing' }, p_auto: { vi: 'Tự chụp', en: 'Auto shoot' },
    open: { vi: 'Mở máy ảnh', en: 'Open camera' },
    privacy: { vi: 'Ảnh chỉ nằm trên máy bạn, không gửi đi đâu', en: 'Photos stay on your phone. Nothing is uploaded.' },
    retake: { vi: 'Chụp lại', en: 'Retake' }, save: { vi: 'Lưu ảnh', en: 'Save' },
    burst: { vi: '{n} tấm liên tiếp, lưu cả {n} để chọn tấm không ai nháy mắt', en: '{n} frames in a row. Save all {n} and pick the one with no blinks.' },
    camErr: { vi: 'Không mở được camera: {e}. Hãy mở bằng Safari qua địa chỉ https:// và cho phép Camera.', en: 'Camera failed: {e}. Open over https:// and allow Camera.' },
    noCam: { vi: 'Trình duyệt không hỗ trợ camera', en: 'This browser has no camera support' },
    noMotion: { vi: 'Chưa có quyền chuyển động: bỏ qua kiểm tra cân máy', en: 'No motion permission: level checks are off' },
    autoOn: { vi: 'Tự chụp: bật', en: 'Auto shoot: on' }, autoOff: { vi: 'Tự chụp: tắt', en: 'Auto shoot: off' },
    poseSet: { vi: 'Dáng mẫu: cho người chụp đứng khớp bóng', en: 'Pose guide: match the silhouette' },
    poseFail: { vi: 'Không tải được mô hình dáng người', en: 'Body model failed to load' },
    shareOk: { vi: 'Đã mở bảng chia sẻ, chọn "Lưu ảnh"', en: 'Share sheet opened, choose "Save Image"' },
    openedImg: { vi: 'Ảnh đã mở, nhấn giữ để lưu', en: 'Image opened, long-press to save' },
    modeAuto: { vi: 'Tự nhận diện tình huống', en: 'Auto detect' },
  };
  const t = (k, p = {}) => (T[k] ? T[k][LANG] : k).replace(/\{(\w+)\}/g, (_, m) => p[m] != null ? p[m] : '');

  // ================= Icons (48x48, stroke) =================
  const I = (body, extra = '') => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${body}</svg>`;
  const ICONS = {
    camera: I('<rect x="6" y="14" width="36" height="26" rx="6"/><circle cx="24" cy="27" r="7"/><path d="M16 14l3-5h10l3 5"/>'),
    lock: I('<rect x="10" y="20" width="28" height="22" rx="5"/><path d="M16 20v-5a8 8 0 0 1 16 0v5"/>'),
    level: I('<path d="M6 24h36"/><path d="M12 18l-6 6 6 6M36 18l6 6-6 6"/>'),
    tilt: I('<rect x="15" y="8" width="18" height="32" rx="4"/><path d="M40 16a14 14 0 0 1 0 16"/><path d="M37 29l3 3 3-3"/>'),
    frame: I('<path d="M8 16V8h8M32 8h8v8M40 32v8h-8M16 40H8v-8"/><circle cx="24" cy="21" r="5"/><path d="M15 36a9 9 0 0 1 18 0"/>'),
    sun: I('<circle cx="24" cy="24" r="8"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.5 10.5l4.2 4.2M33.3 33.3l4.2 4.2M10.5 37.5l4.2-4.2M33.3 14.7l4.2-4.2"/>'),
    auto: I('<path d="M24 6l3.5 9.5L37 19l-9.5 3.5L24 32l-3.5-9.5L11 19l9.5-3.5z"/><path d="M38 32l1.5 4 4 1.5-4 1.5L38 43l-1.5-4-4-1.5 4-1.5z"/>'),
    person: I('<circle cx="24" cy="15" r="7"/><path d="M9 42a15 15 0 0 1 30 0"/>'),
    group: I('<circle cx="16" cy="16" r="6"/><circle cx="32" cy="16" r="6"/><path d="M4 40a12 12 0 0 1 24 0M20 40a12 12 0 0 1 24 0"/>'),
    selfie: I('<rect x="12" y="4" width="24" height="40" rx="5"/><circle cx="24" cy="20" r="5"/><path d="M16 34a8 8 0 0 1 16 0"/>'),
    scene: I('<path d="M4 38l12-16 8 10 6-7 14 13z"/><circle cx="34" cy="13" r="4"/>'),
    food: I('<path d="M6 28h36"/><path d="M10 28a14 14 0 0 1 28 0"/><path d="M8 36h32"/>'),
    grid: I('<rect x="6" y="6" width="36" height="36" rx="4"/><path d="M18 6v36M30 6v36M6 18h36M6 30h36"/>'),
    timer: I('<circle cx="24" cy="26" r="15"/><path d="M24 17v9l6 4M20 6h8"/>'),
    body: I('<circle cx="24" cy="9" r="4.5"/><path d="M24 14v13M24 27l-7 14M24 27l7 14M13 20l11-4 11 4"/>'),
    flip: I('<rect x="6" y="14" width="36" height="26" rx="6"/><path d="M17 27a7 7 0 0 0 14 0"/><path d="M28 22l3 5-6 0"/>'),
    burst: I('<rect x="10" y="14" width="26" height="20" rx="4"/><path d="M6 20v18h22M40 10v18"/>'),
    back: I('<path d="M28 10L14 24l14 14"/>'),
    save: I('<path d="M24 6v24m-9-9l9 9 9-9"/><path d="M8 34v6h32v-6"/>'),
    rotL: I('<path d="M8 21l32 6"/><path d="M12 10a16 16 0 0 0-4 9"/><path d="M6 14l2 5 5-1"/>'),
    rotR: I('<path d="M8 27l32-6"/><path d="M36 10a16 16 0 0 1 4 9"/><path d="M42 14l-2 5-5-1"/>'),
    tiltUp: I('<rect x="14" y="10" width="16" height="30" rx="4"/><path d="M38 34a14 14 0 0 0 0-18"/><path d="M34 19l4-3 3 4"/>'),
    tiltDown: I('<rect x="14" y="10" width="16" height="30" rx="4"/><path d="M38 14a14 14 0 0 1 0 18"/><path d="M34 29l4 3 3-4"/>'),
    holdStraight: I('<rect x="16" y="6" width="16" height="36" rx="4"/><path d="M8 24h4M36 24h4"/><path d="M24 44v2M24 2v2"/>'),
    moveUp: I('<rect x="10" y="12" width="16" height="30" rx="4"/><path d="M36 38V12m-6 6l6-6 6 6"/>'),
    moveDown: I('<rect x="10" y="6" width="16" height="30" rx="4"/><path d="M36 10v26m-6-6l6 6 6-6"/>'),
    closer: I('<circle cx="24" cy="20" r="6"/><path d="M15 36a9 9 0 0 1 18 0"/><path d="M4 24h7m-3-3l3 3-3 3M44 24h-7m3-3l-3 3 3 3"/>'),
    farther: I('<circle cx="24" cy="20" r="6"/><path d="M15 36a9 9 0 0 1 18 0"/><path d="M11 24H4m3-3l-3 3 3 3M37 24h7m-3-3l3 3-3 3"/>'),

  $('cntMinus').addEventListener('click', () => setExpected(S.expected - 1));
  $('cntPlus').addEventListener('click', () => setExpected(S.expected + 1));

  (function buildRail() {
    const rail = $('poseRail');
    POSES.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'pose-btn'; b.setAttribute('aria-pressed', String(i === S.pose));
      if (p.pts) { const c = document.createElement('canvas'); c.width = 72; c.height = 100; drawPose(c.getContext('2d'), p.pts, 14, 6, 44, 90, 1); b.appendChild(c); }
      else b.innerHTML = ICONS.person;
      b.addEventListener('click', () => { S.pose = i; rail.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); if (p.pts) toast(t('poseSet')); });
      rail.appendChild(b);
    });
  })();

  $('startBtn').addEventListener('click', async () => {
    const btn = $('startBtn'); btn.disabled = true; $('startErr').hidden = true;
    const motionOK = await enableMotion();
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error(t('noCam'));
      await openCamera();
    } catch (e) { btn.disabled = false; showCamError(e); return; }
    $('start').hidden = true; $('app').hidden = false; btn.disabled = false;
    if (!motionOK) toast(t('noMotion'));
    loadFace();
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  applyMode('person');
  requestAnimationFrame(loop);
  window.__cc = { S, onOrientation, evaluate, applyMode, H, ICONS };
})();
</script>
